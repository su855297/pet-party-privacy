<style>#PetLoading{position:fixed;inset:0;z-index:9999;background:#fff4e2;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s;font-family:sans-serif}#PetLoading .pet{width:128px;height:128px;background:url(loading-pets.png) no-repeat;background-size:768px 512px}#PetLoading .stage{width:300px;height:170px;display:flex;align-items:flex-end;justify-content:center}#PetLoading .mover{animation:pl-x 2.3s linear 1 both}#PetLoading .hop{animation:pl-hop .46s ease-in-out infinite}#PetLoading .walk{animation:pl-step .26s ease-in-out infinite}@keyframes pl-x{0%{transform:translateX(-110px) scale(0)}7%{transform:translateX(-100px) scale(1)}93%{transform:translateX(100px) scale(1)}100%{transform:translateX(110px) scale(0)}}@keyframes pl-hop{0%,100%{transform:translateY(0) scale(1.06,.94)}45%{transform:translateY(-40px) scale(.95,1.06)}}@keyframes pl-step{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}#PetLoading p{margin:18px 0 0;font-weight:600;font-size:20px;color:#96704f}#PetLoading .bar{margin-top:16px;width:220px;height:14px;border-radius:7px;background:#f0dcc0;overflow:hidden}#PetLoading .bar i{display:block;height:100%;width:6%;border-radius:7px;background:#ff9f43;transition:width .2s}#PetLoading .pct{margin-top:8px;font-size:15px;color:#96704f}#PetLoading .tip{margin-top:22px;max-width:300px;padding:0 16px;text-align:center;font-size:16px;line-height:1.5;color:#96704f}</style>
</head>

<div id="PetLoading"><div class="stage"><div class="mover" id="PetLoadingMover"><div class="pet" id="PetLoadingPet"></div></div></div><p>載入中… Loading…</p><div class="bar"><i id="PetLoadingBar"></i></div><div class="pct" id="PetLoadingPct">0%</div><div class="tip" id="PetLoadingTip"></div></div><script>(function(){var last=-1,pet=document.getElementById("PetLoadingPet"),mv=document.getElementById("PetLoadingMover");function nextPet(){var i=Math.floor(Math.random()*24);if(i===last)i=(i+1)%24;last=i;pet.style.backgroundPosition=(-(i%6)*128)+"px "+(-Math.floor(i/6)*128)+"px";pet.className="pet "+(Math.random()<.5?"hop":"walk");mv.className="";void mv.offsetWidth;mv.className="mover"}mv.addEventListener("animationend",function(e){if(e.target===mv)nextPet()});nextPet();var tips=[{"zh":"寵物衣櫥可以換你的主角寵物喔！","en":"Visit the Pet Wardrobe to change your main pet!"},{"zh":"每天簽到可以領禮物，記得回來看看！","en":"Check in every day to collect a gift!"},{"zh":"每日挑戰每天都不一樣，來試試看！","en":"The Daily Challenge changes every day. Give it a try!"},{"zh":"卡關的時候，試試看下面的道具！","en":"Stuck? Try the boosters at the bottom!"},{"zh":"字太小？設定裡可以打開大字模式。","en":"Text too small? Turn on Large Text in Settings."},{"zh":"打開雲端存檔，換手機進度也不會不見。","en":"Turn on Cloud Save to keep your progress on a new phone."},{"zh":"每週派對任務做完，可以拿大獎勵！","en":"Finish the weekly party tasks for big rewards!"},{"zh":"守村莊：點「圖鑑」可以看每隻怪物怕什麼塔。","en":"Village Defense: open the Codex to see which tower beats each monster."},{"zh":"守村莊：塔蓋在路轉彎的地方，可以打得最久。","en":"Village Defense: build towers at road corners to hit enemies longer."},{"zh":"過關有機會開到寶箱，裡面有好東西！","en":"Clearing a level may give you a chest full of goodies!"}],tp=tips[Math.floor(Math.random()*tips.length)];document.getElementById("PetLoadingTip").textContent=/^zh/i.test(navigator.language||"")?tp.zh:tp.en;var t0=Date.now(),quiet=0,v=0,base=null,doneAt=0;function show(){var b=document.getElementById("PetLoadingBar"),p=document.getElementById("PetLoadingPct");if(b)b.style.width=Math.max(6,v*100)+"%";if(p)p.textContent=Math.round(v*100)+"%"}function off(){var d=document.getElementById("PetLoading");if(!d)return;d.style.opacity="0";setTimeout(function(){d.remove()},450)}function tick(){var target;try{var s=window.cc&&cc.director&&cc.director.getScene();var st=window.__petLoadStats?__petLoadStats():null;if(doneAt){target=1}else if(!st){target=Math.min(.4,v+.04)}else{if(!base)base=st;var n=st.started-base.started,d=st.done-base.done;target=Math.min(.95,Math.max(.4+.55*(n>0?d/n:.5),v+.003))}if(!doneAt&&s&&s.children&&s.children.length>1&&window.__petLoads&&__petLoads()===0){quiet+=100;if(quiet>=600)doneAt=Date.now()}else if(!doneAt){quiet=0}}catch(e){target=Math.min(.95,v+.003)}v=Math.max(v,v+(target-v)*(doneAt?.5:.2));show();if(doneAt&&Date.now()-doneAt>250){v=1;show();off();return}if(Date.now()-t0>60000){off();return}setTimeout(tick,100)}tick()})();</script>
