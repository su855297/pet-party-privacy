<style>#PetLoading{position:fixed;inset:0;z-index:9999;background:#fff4e2;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}#PetLoading img{width:120px;height:120px;border-radius:28px;box-shadow:0 6px 18px rgba(0,0,0,.15)}#PetLoading .bar{margin-top:28px;width:180px;height:12px;border-radius:6px;background:#f0dcc0;overflow:hidden}#PetLoading .bar i{display:block;height:100%;width:40%;border-radius:6px;background:#ff9f43;animation:petload 1.1s ease-in-out infinite}#PetLoading p{margin-top:14px;font:600 18px sans-serif;color:#8a6a4a}@keyframes petload{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}</style>

<div id="PetLoading"><img src="icon.png" alt=""><div class="bar"><i></i></div><p>載入中… Loading…</p></div><script>(function(){var t0=Date.now(),quiet=0;function off(){var d=document.getElementById("PetLoading");if(!d)return;d.style.opacity="0";setTimeout(function(){d.remove()},450)}function check(){try{var s=window.cc&&cc.director&&cc.director.getScene();var n=window.__petLoads?window.__petLoads():0;if(s&&s.children&&s.children.length>1&&n===0){quiet+=200;if(quiet>=600){off();return}}else{quiet=0}}catch(e){}if(Date.now()-t0>60000){off();return}setTimeout(check,200)}check()})();</script>
